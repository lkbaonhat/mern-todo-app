services:
  backend:
    image: mern-todo-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    pull_policy: never
    restart: unless-stopped
    env_file: /opt/mern-todo/backend.env
    environment:
      PORT: "8001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 15s
  frontend:
    image: mern-todo-frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    pull_policy: never
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
