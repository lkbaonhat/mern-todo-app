server {
        listen 80;
        listen [::]:80;

        server_name mern-todo-app.lekimbaonhat.com;

        return 301  https://$host$request_uri;
}

server {
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name mern-todo-app.lekimbaonhat.com;

        ssl_certificate /etc/nginx/ssl/lekimbaonhat-public.crt;
        ssl_certificate_key /etc/nginx/ssl/lekimbaonhat-private.key;

        location / {
                proxy_pass  http://0.0.0.0:3001;
                include proxy_params;
        }
}

